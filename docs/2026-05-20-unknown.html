<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title> — Research Note</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500&family=Pretendard+Variable&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a0a0a;--paper:#fafaf7;--muted:#6b6b66;--line:#1a1a1a;--line-soft:#d8d6cf;--accent:#b8451f;--highlight:#fff3a0;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Pretendard Variable','Fraunces',Georgia,serif;font-feature-settings:"kern","liga","ss01";font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;}
.page{max-width:720px;margin:0 auto;padding:64px 32px 120px;}
.masthead{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:48px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);}
.masthead .left{font-weight:500;color:var(--ink);}
.masthead .right{text-align:right;}
.kicker{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);margin-bottom:16px;}
h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:44px;line-height:1.1;letter-spacing:-0.02em;margin:0 0 20px;color:var(--ink);}
.standfirst{font-family:'Fraunces',Georgia,serif;font-size:19px;line-height:1.5;color:var(--muted);font-weight:400;margin-bottom:40px;max-width:600px;}
.byline{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:0.06em;padding-bottom:32px;margin-bottom:48px;border-bottom:1px solid var(--line-soft);}
.byline span+span::before{content:" · ";margin:0 4px;}
.tldr{margin:0 0 56px;padding:24px 28px;border-left:2px solid var(--ink);}
.tldr-label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
.tldr p{margin:0 0 8px;font-size:16px;line-height:1.55;}
.tldr p:last-child{margin-bottom:0;}
h2{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:26px;letter-spacing:-0.01em;margin:56px 0 20px;padding-top:24px;border-top:1px solid var(--line);}
h2 .num{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;color:var(--muted);margin-right:12px;vertical-align:4px;letter-spacing:0.05em;}
p{margin:0 0 16px;}
.facts{display:grid;grid-template-columns:140px 1fr;gap:4px 32px;margin:32px 0 40px;padding:24px 0;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);font-size:14px;}
.facts dt{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);padding-top:4px;}
.facts dd{margin:0;padding-bottom:12px;border-bottom:1px dotted var(--line-soft);}
.facts dd:last-of-type{border-bottom:none;padding-bottom:0;}
.facts a{color:var(--accent);text-decoration:none;}
.competitor-list{margin:0;padding:0;list-style:none;}
.competitor-list li{padding:20px 0;border-bottom:1px solid var(--line-soft);}
.competitor-list li:last-child{border-bottom:none;}
.competitor-list h3{font-family:'Fraunces',Georgia,serif;font-size:18px;font-weight:600;margin:0 0 6px;}
.competitor-list h3 .url{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);font-weight:400;margin-left:8px;text-decoration:none;}
.competitor-list .pos{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.06em;color:var(--muted);text-transform:uppercase;margin-bottom:8px;}
.competitor-list p{font-size:15px;margin:0;}
table.opportunities{width:100%;border-collapse:collapse;margin:24px 0 40px;font-size:14px;}
.opportunities th{text-align:left;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);padding:10px 12px 10px 0;border-bottom:1px solid var(--line);vertical-align:bottom;}
.opportunities td{padding:16px 12px 16px 0;border-bottom:1px solid var(--line-soft);vertical-align:top;line-height:1.5;}
.opportunities td:first-child{font-family:'JetBrains Mono',monospace;color:var(--muted);font-size:12px;width:28px;}
.priority{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.08em;padding:2px 7px;text-transform:uppercase;border:1px solid var(--ink);}
.priority.high{background:var(--ink);color:var(--paper);}
.priority.med{background:transparent;color:var(--ink);}
.priority.low{background:transparent;color:var(--muted);border-color:var(--line-soft);}
.next-action{margin:32px 0 48px;padding:28px 32px;background:var(--ink);color:var(--paper);}
.next-action .label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#999;margin-bottom:10px;}
.next-action p{font-family:'Fraunces',Georgia,serif;font-size:18px;line-height:1.5;margin:0;}
.sources{margin-top:56px;padding-top:24px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);}
.sources-label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink);margin-bottom:12px;}
.sources ol{padding-left:20px;margin:0;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.8;}
.sources ol a{color:var(--accent);text-decoration:none;word-break:break-all;}
.colophon{margin-top:80px;padding-top:24px;border-top:1px solid var(--line-soft);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.08em;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between;}
</style>
</head>
<body>

</body>
</html>
